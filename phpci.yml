complete:

success:
  \UpAssist\PHPCI\Deployer\Plugin\Deployer:
    deployFile: 'Build/BuildTools/Deployer/deploy.php'
    master:
      stage: test
      server: rwv.etopia.nl
      user: www-data
      deploy_path: /var/www/rwv.etopia.nl
      shared_dirs:
        - 'Data/Persistent/'
        - 'Data/Forms/'
      writable_dirs:
        - 'Data/Persistent/'
        - 'Data/Forms/'
        - 'Data/'
      run:
        migrate: true
        noderepair: false
        nodeindex: false
        nodeindexcleanup: false
        flush: true
        warmup: true

